    <dc:title>Fixed n-gram speculation: fewer steps, higher expert traffic</dc:title>
    <dc:date>2026-10-02T14:48:18.326115</dc:date>
    <dc:description>Natural EOS; 16 requests/run, n=2 independent runs/arm. Bars: run means; points: individual runs. Each metric is normalized by the AR run mean. Completion time includes final drain; initialization and warmup are excluded. Output counts differ; times are not equal-work speedups. OLMoE; artificial expert-cache cap of 24 experts/layer.</dc:description>
